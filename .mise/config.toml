[env]
ANSIBLE_VERSION = "11.4.0" # renovate: datasource=pypi depName=ansible
ANSIBLE_CREATOR_VERSION = "25.3.1" # renovate: datasource=pypi depName=ansible-creator

[settings]
lockfile = true

[tools]
'pipx:check-jsonschema' = '0.38.2'
actionlint = '1.7.12'
cilium-cli = '0.19.5'
cilium-hubble = '1.19.4'
conftest = '0.71.1'
