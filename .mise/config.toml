github-cli = '2.103.0'
gitleaks = '8.30.1'
helm = '4.3.1'
kind = '0.33.0'
kubeconform = '0.8.0'
kyverno = '1.18.1'
pre-commit = '4.7.0'
python = '3.15.1'
shellcheck = '0.11.0'
shfmt = '3.14.1'
terraform = '1.17.0'
terraform-docs = '0.24.0'
tflint = '0.65.0'
trivy = '0.76.1'
typos = '1.51.1'
uv = '0.13.3'
vale = '3.25.1'
yq = '4.54.1'
zizmor = '1.31.1'
