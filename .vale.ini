# Vale checks the documentation against a subset of ASD-STE100 (Simplified Technical English).
# The STE rules are in .vale/styles/STE/. The Homelab rules, for the voice and
# the tense of the pages in docs/, are in .vale/styles/Homelab/. Refer to docs/reference/writing-rules.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE

# The Homelab rules check the voice and the tense of the pages in docs/.
[docs/**/*.md]
BasedOnStyles = STE, Homelab

# Temporary: these pages still break the Homelab rules. Each rollout PR that
# rewrites one of them removes it from this list. Remove the section when the
# list is empty.
[docs/{explanation/automated-updates,explanation/how-we-work,explanation/labels-and-annotations,explanation/repository-scope,explanation/repository-structure,reference/how-we-work,reference/provider-accounts,reference/repository-structure}.md]
BasedOnStyles = STE

# CHANGELOG.md is generated from commit messages.
[CHANGELOG.md]
BasedOnStyles =

# Ansible will be removed. Its reference pages are generated from the role tasks.
[docs/reference/ansible-roles/**]
BasedOnStyles =

# Helm charts can come from upstream projects.
[**/charts/**]
BasedOnStyles =

# Nobody maintains the archived pages.
[docs/archive/**]
BasedOnStyles =
