# Vale checks the documentation against a subset of ASD-STE100 (Simplified Technical English).
# The rules are in .vale/styles/STE/. Refer to docs/reference/writing-rules.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE

# CHANGELOG.md is generated from commit messages.
[CHANGELOG.md]
BasedOnStyles =

# Ansible will be removed. Its reference pages are generated from the role tasks.
[docs/reference/ansible-roles/**]
BasedOnStyles =

# Helm charts can come from upstream projects.
[**/charts/**]
BasedOnStyles =

# Nobody maintains the archived pages.
[docs/archive/**]
BasedOnStyles =
