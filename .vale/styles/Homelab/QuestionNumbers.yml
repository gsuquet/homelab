# A page does not refer to the numbered questions of a plan or a review.
# State the answer as a fact.
# Refer to docs/reference/writing-rules.md.
extends: existence
message: "Remove '%s'. Do not refer to a question number. State the answer as a fact."
level: error
ignorecase: false
# Vale joins the items of "raw" into one expression, so the alternatives are
# in one item. A quarter of a year, for example "Q1 2027", does not match.
raw:
  - '\b(?:Q\d+(?! \d{4}\b)|(?i:questions?) #?\d+)\b'
