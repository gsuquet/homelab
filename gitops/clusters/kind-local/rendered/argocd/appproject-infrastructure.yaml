---
# Source: argocd/templates/appproject-infrastructure.yaml
# Infrastructure components can change all resources, also cluster-scoped resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
spec:
  description: Infrastructure components in gitops/infrastructure/.
  sourceRepos:
    - https://github.com/gsuquet/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
