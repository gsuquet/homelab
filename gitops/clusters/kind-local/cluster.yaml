# yaml-language-server: $schema=../../../schemas/gitops-cluster.schema.json
---
# GitOps entry point of the kind-local cluster. The argocd component makes one
# Argo CD Application for each component in these lists.
apiVersion: infra.gsuquet.com/v1alpha1
kind: GitOpsCluster
name: kind-local
infrastructure:
  - name: argocd
    namespace: argocd
  # No dependsOn yet. kgateway starts without cert-manager (xDS TLS is off). A
  # later change adds dependsOn: [cert-manager] for the xDS and Gateway TLS secrets.
  - name: kgateway
    namespace: kgateway-system
apps: []
