# yaml-language-server: $schema=../../schemas/gitops-instance.schema.json
---
# GitOps entry point of the kind-local instance. Argo CD makes one Application
# for each component in these lists.
apiVersion: infra.gsuquet.com/v1alpha1
kind: GitOpsInstance
instance: kind-local
platform:
  - name: argocd
    namespace: argocd
apps: []
