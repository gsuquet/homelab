# Source: argocd/templates/applicationsets.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    # Do not delete the resources of an Application when the ApplicationSet deletes the Application.
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/gsuquet/homelab.git
              revision: main
              files:
                - path: gitops/instances/kind-local.yaml
          - list:
              elementsYaml: "{{ .apps | toJson }}"
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: apps
      source:
        repoURL: https://github.com/gsuquet/homelab.git
        targetRevision: main
        path: "gitops/apps/{{ .name }}/rendered/kind-local"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
