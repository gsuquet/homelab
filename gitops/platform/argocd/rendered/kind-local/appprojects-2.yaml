# Source: argocd/templates/appprojects.yaml
# Applications can change namespaced resources only, and not in the system namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Applications in gitops/apps/.
  sourceRepos:
    - https://github.com/gsuquet/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "!kube-system"
    - server: https://kubernetes.default.svc
      namespace: "!argocd"
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

