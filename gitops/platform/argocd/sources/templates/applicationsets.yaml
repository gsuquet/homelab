{{- /*
One ApplicationSet for each folder of gitops/: platform and apps.
gitops/instances/<instance>.yaml lists the components of the instance. The
ApplicationSet makes one Application for each component in the list. The
Application syncs gitops/<group>/<component>/rendered/<instance>/.
*/ -}}
{{- $instance := include "argocd.instance" . }}
{{- range $index, $group := list "platform" "apps" }}
{{- if $index }}
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $group }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    # Do not delete the resources of an Application when the ApplicationSet deletes the Application.
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ $.Values.gitops.repoURL }}
              revision: {{ $.Values.gitops.targetRevision }}
              files:
                - path: gitops/instances/{{ $instance }}.yaml
          - list:
              elementsYaml: "{{`{{ .`}}{{ $group }}{{` | toJson }}`}}"
  template:
    metadata:
      name: "{{`{{ .name }}`}}"
    spec:
      project: {{ $group }}
      source:
        repoURL: {{ $.Values.gitops.repoURL }}
        targetRevision: {{ $.Values.gitops.targetRevision }}
        path: "gitops/{{ $group }}/{{`{{ .name }}`}}/rendered/{{ $instance }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{`{{ .namespace }}`}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
{{- end }}
