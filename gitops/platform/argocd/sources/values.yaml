# Values for all instances. values/<instance>.yaml adds the values for one instance.

# Settings of the GitOps entry point. The templates in templates/ use them.
gitops:
  # Repository that Argo CD reads.
  repoURL: https://github.com/gsuquet/homelab.git
  # Git revision that Argo CD syncs. A test instance can use a branch.
  targetRevision: main
  # Instance name. Each values/<instance>.yaml must set it.
  instance: ""

argo-cd:
  fullnameOverride: argocd
  namespaceOverride: argocd

  crds:
    annotations:
      # Argo CD must not delete its own CRDs. A deleted CRD deletes all the Applications.
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
      # Sync waves: -2 Namespace, -1 CRDs, 0 the rest.
      argocd.argoproj.io/sync-wave: "-1"

  global:
    logging:
      format: json
      level: warn
    revisionHistoryLimit: 3

  configs:
    cm:
      admin.enabled: true
      exec.enabled: false
    params:
      # TLS stops at the gateway or at kubectl port-forward.
      server.insecure: true
      # The API server computes the diff. It goes with server-side apply and
      # does not show defaulted fields as OutOfSync.
      controller.diff.server.side: true
    rbac:
      # A logged-in user without a role can look, but not change.
      policy.default: role:readonly
    # Argo CD creates argocd-secret when it starts. Thus the repository has no Secret.
    secret:
      createSecret: false

  # Resources: memory request equal to the limit, a CPU request and no CPU
  # limit (the cluster resource policy). Sized for a Raspberry Pi 4 with 8 GiB.
  # Tune them from the metrics.
  controller:
    metrics:
      enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        memory: 768Mi

  dex:
    enabled: false

  notifications:
    enabled: false

  redis:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi

  redisSecretInit:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

  server:
    metrics:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 192Mi

  repoServer:
    metrics:
      enabled: true
    # The copyutil init container uses the same resources.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 384Mi

  applicationSet:
    metrics:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
