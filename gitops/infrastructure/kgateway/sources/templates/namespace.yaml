apiVersion: v1
kind: Namespace
metadata:
  name: kgateway-system
  labels:
    # TODO: the control plane pod complies with restricted (to check on the live cluster).
    # The Envoy proxies that kgateway makes for a Gateway run in the namespace of the Gateway.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    tenant.infra.gsuquet.com/name: platform
    ownership.infra.gsuquet.com/owner: gsuquet
    app.kubernetes.io/name: kgateway
    app.kubernetes.io/instance: kgateway
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
