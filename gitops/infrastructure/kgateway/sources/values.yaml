# Values for all clusters. gitops/clusters/<cluster>/values/kgateway.yaml can
# override them for one cluster.
#
# The Gateway API CRDs are not in these charts (checked at v2.5.0): the
# Terraform module bootstrap-gateway-api owns them. kgateway-crds has only the
# CRDs of gateway.kgateway.dev.

kgateway:
  # The default GatewayClass uses the GatewayParameters of templates/gatewayparameters.yaml.
  # This value is at the top level of the kgateway chart, not under controller.
  gatewayClassParametersRefs:
    kgateway:
      name: default
      namespace: kgateway-system

  controller:
    image:
      # Digest of the multi-arch index of cr.kgateway.dev/kgateway-dev/kgateway:v2.5.0
      # (amd64 and arm64). The chart appends the tag to the repository. The tag
      # must equal the chart version; renovate.json updates both together.
      # The Envoy image is pinned in templates/gatewayparameters.yaml.
      tag: "v2.5.0@sha256:2c6695a308fa8fda0127b23fc2246e2f26c0d93f849736690912a932d72fd9d5"
    # Memory request equal to the limit, a CPU request, no CPU limit.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
