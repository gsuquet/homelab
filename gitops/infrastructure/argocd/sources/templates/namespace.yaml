apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    # All the Argo CD pods comply with the restricted Pod Security Standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # Argo CD must not delete its own namespace, also when the argocd Application is deleted.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # Sync waves: -2 Namespace, -1 CRDs, 0 the rest, 1 and more the Applications.
    argocd.argoproj.io/sync-wave: "-2"
