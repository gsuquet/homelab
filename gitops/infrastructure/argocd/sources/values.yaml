# Values for all clusters. gitops/clusters/<cluster>/values/argocd.yaml can
# override them for one cluster.

# Settings of the GitOps entry point. The templates in templates/ use them.
gitops:
  # Repository that Argo CD reads.
  repoURL: https://github.com/gsuquet/homelab.git
  # Git revision that Argo CD syncs. A test cluster can use a branch.
  targetRevision: main
  # Content of gitops/clusters/<cluster>/cluster.yaml. manifests:render sets it.
  cluster: {}

argo-cd:
  fullnameOverride: argocd
  namespaceOverride: argocd

  crds:
    annotations:
      # Argo CD must not delete its own CRDs. A deleted CRD deletes all the Applications.
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
      # Sync waves: -2 Namespace, -1 CRDs, 0 the rest, 1 and more the Applications.
      argocd.argoproj.io/sync-wave: "-1"

  global:
    logging:
      format: json
      level: warn
    revisionHistoryLimit: 3

  configs:
    cm:
      admin.enabled: true
      exec.enabled: false
      # The health of an Application is the health of its resources. Thus the
      # sync waves of the argocd Application wait for each component. The argocd
      # Application is in its own folder: it is always Healthy, else it waits
      # for itself. The bootstrap-argocd module uses the same name.
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.metadata.name == "argocd" then
          hs.status = "Healthy"
          return hs
        end
        if obj.status ~= nil and obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
        return hs
    params:
      # TLS stops at the gateway or at kubectl port-forward.
      server.insecure: true
      # The API server computes the diff. It goes with server-side apply and
      # does not show defaulted fields as OutOfSync.
      controller.diff.server.side: true
      # A sync stops after 15 minutes. Without a timeout, one component that
      # never becomes Healthy stops all the later syncs of the argocd
      # Application, also the upgrades of Argo CD.
      controller.sync.timeout.seconds: "900"
    rbac:
      # A logged-in user without a role can look, but not change.
      policy.default: role:readonly
    # argocd-server does not start without argocd-secret: it only adds its keys
    # (server.secretkey, the admin password) to a Secret that exists. The chart
    # makes the Secret with no data, thus Git has no secret values. Set webhook,
    # SSO or admin values with SOPS, not here.
    secret:
      createSecret: true
      annotations:
        # The Secret holds the keys that argocd-server makes at runtime. Argo CD
        # must not delete it, for example when a commit removes it from Git.
        argocd.argoproj.io/sync-options: Prune=false,Delete=false

  # Resources: memory request equal to the limit, a CPU request and no CPU
  # limit (the cluster resource policy). Sized for a Raspberry Pi 4 with 8 GiB.
  # Tune them from the metrics.
  controller:
    metrics:
      enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        memory: 768Mi

  dex:
    enabled: false

  notifications:
    enabled: false

  redis:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi

  redisSecretInit:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

  server:
    metrics:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 192Mi

  repoServer:
    metrics:
      enabled: true
    # The copyutil init container uses the same resources.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 384Mi

  applicationSet:
    metrics:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
