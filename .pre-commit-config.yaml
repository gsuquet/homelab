---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: pretty-format-json
        args:
          - --autofix

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6d15fe12fcac80fe0c349677eaa23f6d5f943818  # frozen: 41.173.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: local
    hooks:
      - id: render-manifests
        name: Render and split Kubernetes manifests
        entry: bash -c 'mise run manifests:render && git add kubernetes/ gitops/'
        language: system
        files: '^(kubernetes/.*/sources/|gitops/.*/(sources|values)/).*\.yaml$'
        pass_filenames: false
        stages: [commit]

      - id: generate-docs
        name: Auto-generate Ansible and Terraform documentation
        entry: bash -c 'mise run doc:generate && git add docs/reference/ansible-roles docs/reference/terraform-modules modules'
        language: system
        files: "^(ansible/roles|modules)/.*"
        pass_filenames: false
        stages: [commit]

      - id: schemas-test
        name: Test JSON Schemas against fixtures
        entry: mise run schemas:test
        language: system
        files: '^(schemas/|\.mise/tasks/schemas/)'
        pass_filenames: false

      - id: schemas-check
        name: Validate module.yaml and instance.yaml files
        entry: mise run schemas:check
        language: system
        files: '^(schemas/.*\.schema\.json|modules/[^/]+/module\.yaml|instances/[^/]+/instance\.yaml)$'
        pass_filenames: false

      - id: lint-terraform
        name: Check Terraform format and run TFLint
        entry: mise run lint:terraform
        language: system
        files: '(\.tf|\.tflint\.hcl)$'
        pass_filenames: false

      - id: lint-policy
        name: Test and run Conftest policies
        entry: mise run lint:policy
        language: system
        files: '(^policy/|\.tf$|\.ya?ml$|^\.mise/config\.toml$)'
        pass_filenames: false

      - id: lint-actions
        name: Lint GitHub Actions workflows
        entry: mise run lint:actions
        language: system
        files: '^\.github/workflows/'
        pass_filenames: false

      - id: lint-shell
        name: Lint and check format of shell scripts
        entry: mise run lint:shell
        language: system
        types: [shell]
        pass_filenames: false

      - id: lint-docs
        name: Check Markdown files against the ASD-STE100 rules
        entry: mise run lint:docs
        language: system
        files: '(\.md$|^\.vale)'
        pass_filenames: false
