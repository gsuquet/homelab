---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: pretty-format-json
        args:
          - --autofix

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 41.173.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: local
    hooks:
      - id: render-manifests
        name: Render and split Kubernetes manifests
        entry: bash -c 'mise run manifests:render && git add kubernetes/**/manifests/'
        language: system
        files: 'kubernetes/.*/sources/.*\.yaml$'
        pass_filenames: false
        stages: [commit]

      - id: generate-docs
        name: Auto-generate Ansible and Terraform documentation
        entry: bash -c 'mise run doc:generate && git add docs/reference/ansible-roles docs/reference/terraform-modules'
        language: system
        files: "(ansible/roles|terraform/modules)/.*"
        pass_filenames: false
        stages: [commit]
