# PR labeler configuration file.
# Syntax: https://github.com/actions/labeler/tree/v5.0.0#usage
# Each key is a label of .github/labels.yml.
area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .pre-commit-config.yaml
          - renovate.json

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '*.md'
          - '**/README.md'
          - LICENSE

area/tooling:
  - changed-files:
      - any-glob-to-any-file:
          - .mise/**
          - .vale/**
          - .vale.ini
          - .editorconfig
          - .yamllint.yaml
          - .shellcheckrc
          - .terraform-docs.yml
          - .tflint.hcl
          - .typos.toml
          - .gitignore
          - .claude/**
          - .gemini/**
          - .entire/**
          - .vscode/**

area/modules:
  - changed-files:
      - any-glob-to-any-file:
          - modules/**

area/instances:
  - changed-files:
      - any-glob-to-any-file:
          - instances/**

area/gitops:
  - changed-files:
      - any-glob-to-any-file:
          - gitops/**

area/policy:
  - changed-files:
      - any-glob-to-any-file:
          - policy/**
          - schemas/**

area/legacy:
  - changed-files:
      - any-glob-to-any-file:
          - ansible/**
          - kubernetes/**

# kind/*: from the prefix of the head branch (head-branch matcher, actions/labeler v5.0.0).
kind/feature:
  - head-branch:
      - '^feat/'

kind/bug:
  - head-branch:
      - '^fix/'

kind/docs:
  - head-branch:
      - '^docs/'

kind/chore:
  - head-branch:
      - '^chore/'
      - '^refactor/'
      - '^ci/'
      - '^renovate/'
