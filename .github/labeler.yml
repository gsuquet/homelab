# PR labeler configuration file.
# Syntax: https://github.com/actions/labeler/tree/v5.0.0#usage
# Each key is a label of .github/labels.yml.
area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .pre-commit-config.yaml
          - renovate.json

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '*.md'
          - '**/README.md'
          - LICENSE

area/tooling:
  - changed-files:
      - any-glob-to-any-file:
          - .mise/**
          - .vale/**
          - .vale.ini
          - .editorconfig
          - .yamllint.yaml
          - .shellcheckrc
          - .terraform-docs.yml
          - .tflint.hcl
          - .typos.toml
