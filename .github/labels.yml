# Labels of the repository. RFC 0002 ("Labels as code") and ADR 0012 define them.
# Apply with `mise run labels:sync`. Only the owner runs it.
# color: 6 hex digits, no "#". description: 100 characters or fewer.

# kind/: what is this item?
- name: kind/feature
  color: "1F6FEB"
  description: New behavior
- name: kind/bug
  color: "1F6FEB"
  description: Wrong behavior
- name: kind/docs
  color: "1F6FEB"
  description: Documentation only, not a record
- name: kind/record
  color: "1F6FEB"
  description: An RFC or an ADR
- name: kind/chore
  color: "1F6FEB"
  description: Maintenance, refactoring, CI, dependencies

# area/: which part of the repository does it change?
- name: area/records
  color: "8250DF"
  description: Changes under docs/records/
- name: area/docs
  color: "8250DF"
  description: Changes under docs/ except docs/records/, and *.md at the root
- name: area/ci
  color: "8250DF"
  description: Changes under .github/, .pre-commit-config.yaml, renovate.json
- name: area/tooling
  color: "8250DF"
  description: Changes under .mise/, .vale/, .vale.ini, the linter configuration files
- name: area/modules
  color: "8250DF"
  description: Changes under modules/
- name: area/instances
  color: "8250DF"
  description: Changes under instances/
- name: area/gitops
  color: "8250DF"
  description: Changes under gitops/
- name: area/policy
  color: "8250DF"
  description: Changes under policy/ and schemas/
- name: area/legacy
  color: "8250DF"
  description: Changes under ansible/ and kubernetes/

# state/: does something block it?
- name: state/blocked
  color: "BF8700"
  description: Another item or an outside event blocks this item. The description tells which.
- name: state/needs-owner
  color: "BF8700"
  description: The item waits for a decision of the owner.

# No prefix: Renovate sets these.
- name: renovate
  color: "2DA44E"
  description: Set by Renovate on each PR
- name: security
  color: "CF222E"
  description: Set by Renovate on vulnerability PRs
